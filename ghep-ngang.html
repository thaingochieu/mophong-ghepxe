<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mô Phỏng Ghép Xe Ngang</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1a202c; color: white; font-family: sans-serif; }

        /* Bảng điều khiển dọc bên phải */
        .dashboard {
            background: #2d3748;
            border-left: 2px solid #4a5568;
            box-shadow: -4px 0 6px rgba(0,0,0,0.3);
            z-index: 20;
            height: 100vh;
            width: 340px;
            min-width: 280px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            padding-top: 32px;
            padding-bottom: 32px;
        }

        canvas {
            display: block;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            cursor: crosshair;
        }

        .wheel-container { position: relative; width: 80px; height: 80px; }
        .wheel { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; transition: transform 0.1s linear; }

        .gear { padding: 4px 10px; font-size: 11px; border-radius: 4px; background: #4a5568; color: #a0aec0; border: 2px solid transparent; transition: all 0.2s; font-weight: bold;}
        .gear.active-forward { background: #fee2e2; color: #ef4444; border-color: #ef4444; box-shadow: 0 0 10px rgba(239, 68, 68, 0.4);}
        .gear.active-reverse { background: #e0f2fe; color: #3b82f6; border-color: #3b82f6; box-shadow: 0 0 10px rgba(59, 130, 246, 0.4);}

        .warning-overlay {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            padding: 10px 30px; border-radius: 8px; font-size: 1.5rem; font-weight: bold;
            display: none; z-index: 30; animation: blink 0.5s infinite alternate;
        }

        @keyframes blink { from { opacity: 1; } to { opacity: 0.5; } }

        input[type="range"] { cursor: pointer; }
        .kbd { background: #1a202c; padding: 2px 4px; border-radius: 4px; font-family: monospace; font-size: 0.85em; border-bottom: 1px solid #000; color: #63b3ed;}
    </style>
</head>
<body class="flex flex-row h-screen w-screen">

<!-- Bảng điều khiển (Dọc, bên phải) -->
<div class="dashboard">
    <!-- Cụm 1: Vô lăng, Cần số & Thông số -->
    <div class="flex flex-col items-center gap-4 bg-stone-50 p-5 rounded-2xl border-4 bg-stone-50 shadow-lg mx-4">
        <div class="flex flex-col items-center gap-1.5">
            <div class="wheel-container" style="width:120px;height:120px;">
                <img id="wheelImg" src="steering_wheel.png" class="wheel" alt="Vô lăng">
            </div>
            <!-- Cần số thu nhỏ -->
            <div class="flex items-center gap-2">
                <div id="gearForward" class="gear active-forward">TIẾN</div>
                <div id="gearReverse" class="gear">LÙI</div>
                <button id="btnReset" class="gear bg-red-600 hover:bg-red-500 text-white border-red-500 cursor-pointer ml-1" title="Đặt lại vị trí xe">RESET</button>
            </div>
        </div>
        <div id="steeringText" class="w-32 text-lg font-bold text-yellow-600 text-center">Thẳng lái</div>
    </div>

    <!-- Cụm 2: Cấu hình Kích thước & Tốc độ -->
    <div class="flex flex-col gap-6 bg-gray-800 p-3 rounded-lg border border-gray-600 mx-4">
        <!-- Cột Tốc độ -->
        <div class="flex flex-col gap-2">
            <div class="flex flex-col">
                <label class="text-xs text-gray-300 flex justify-between">Tốc độ: <span id="valMove">0.5</span></label>
                <input type="range" id="cfgMoveSpeed" class="w-28" min="0.5" max="3" step="0.1" value="0.5">
            </div>
            <div class="flex flex-col">
                <label class="text-xs text-gray-300 flex justify-between">Quay lái: <span id="valSteer">1.0</span></label>
                <input type="range" id="cfgSteerSpeed" class="w-28" min="0.5" max="4" step="0.1" value="1.0">
            </div>
        </div>
        <!-- Cột Kích thước -->
        <div class="flex flex-col gap-2 justify-center">
            <div class="flex justify-between items-center gap-2">
                <label class="text-xs text-green-300">Dài xe (a):</label>
                <div class="flex items-center">
                    <input type="number" id="cfgCarA" class="w-16 h-6 bg-gray-700 text-white rounded px-1.5 text-sm border border-gray-600 focus:outline-none focus:border-green-400" min="3.5" max="6.0" step="0.1" value="4">
                    <span class="ml-1 text-xs text-gray-400">m</span>
                </div>
            </div>
            <div class="flex justify-between items-center gap-2">
                <label class="text-xs text-green-300">Rộng xe (b):</label>
                <div class="flex items-center">
                    <input type="number" id="cfgCarB" class="w-16 h-6 bg-gray-700 text-white rounded px-1.5 text-sm border border-gray-600 focus:outline-none focus:border-green-400" min="1.4" max="2.4" step="0.1" value="2">
                    <span class="ml-1 text-xs text-gray-400">m</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Cụm 4: Hướng dẫn -->
    <div class="bg-gray-800 p-3 rounded-lg border border-gray-600 text-[13px] text-gray-300 leading-relaxed mx-4">
        <span class="kbd">A</span> / <span class="kbd">D</span> : Quay vô lăng trái/phải <br>
        <span class="kbd">Cuộn ↑↓</span> : Sang số Tiến/Lùi <br>
        <span class="kbd">Giữ Chuột Trái</span> : Đạp ga (Di chuyển)
    </div>
</div>

<!-- Khu vực Canvas Game -->
<div class="flex-1 flex items-center justify-center relative bg-gray-900 overflow-hidden">
    <div id="warningMsg" class="warning-overlay" style="background-color: #ef4444; color: white;">
        ⚠️ XE ĐÈ VẠCH ⚠️
    </div>
    <canvas id="gameCanvas" style="width:100%;height:100%;display:block;"></canvas>
</div>

<!-- Load xe -->
<img id="carImg" src="car.png" style="display: none;">

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // UI Elements
    const wheelImg = document.getElementById('wheelImg');
    const steeringText = document.getElementById('steeringText');
    const gearForward = document.getElementById('gearForward');
    const gearReverse = document.getElementById('gearReverse');
    const warningMsg = document.getElementById('warningMsg');
    const carImage = document.getElementById('carImg');
    const carImageCrop = { sx: 0, sy: 0, sw: 0, sh: 0, ready: false };

    // TỶ LỆ CHUYỂN ĐỔI: 1 mét = 45 pixels
    const SCALE = 45;

    // Các biến Kích thước & Môi trường
    let CAR_A = 4;
    let CAR_B = 2;
    let ENV = {};
    let yellowLines = [];
    let borderLines = [];

    // Offset để căn giữa bản đồ trên canvas
    let mapOffsetX = 0, mapOffsetY = 0;

    // Hàm tính toán offset để căn giữa map vào canvas
    function calculateMapOffset() {
        const minX = ENV.roadLeft;
        const maxX = ENV.borderRight;
        const minY = ENV.mapTop;
        const maxY = ENV.mapBottom;
        const mapWidth = maxX - minX;
        const mapHeight = maxY - minY;

        mapOffsetX = (canvas.width - mapWidth) / 2 - minX;
        mapOffsetY = (canvas.height - mapHeight) / 2 - minY;
    }

    const GAME_CONFIG = {
        moveSpeed: 0.5,
        steerSpeed: 1.0,
        maxSteerTurns: 2.5,
        maxSteerAngleRad: 40 * (Math.PI / 180),
    };

    const car = {
        x: 0, y: 0,
        angle: -Math.PI / 2, // Mặt định quay lên trên (song song với chuồng ghép ngang)
        steeringTurns: 0,
        gear: 1,
        isMoving: false
    };

    const keys = { A: false, D: false };

    const COLLISION_FRONT_SCALE = 0.80;
    const COLLISION_REAR_SCALE = 0.72;
    const COLLISION_SIDE_SCALE = 0.72;
    const SHOW_HITBOX_DEBUG = false;

    const STEERING_LOCAL_RATIO = { x: 0.22, y: -0.16 };
    const DRIVER_SEAT_LOCAL_RATIO = { x: 0.02, y: -0.20 };

    const STRAIGHT_STEER_HOLD_SEC = 0.5;
    const STEER_NEUTRAL_THRESHOLD = 0.05;
    let steerUIState = 'straight';
    let steerHoldUntilMs = 0;
    let wasInNeutralZone = true;
    let hasParkingSuccess = false;
    let hasExerciseCompleted = false;

    // Hàm tính toán Hình học toàn bộ bản đồ GHÉP NGANG
    function calculateEnvironment() {
        // Công thức chuẩn theo ghép ngang: Lg = 5a/3 (Chiều dài), Rg = 5b/4 (Chiều rộng)
        const Lg_m = (5 * CAR_A) / 3;
        const Rg_m = (5 * CAR_B) / 4;
        const RoadW_m = 4.0; // Độ rộng lề đường giả định

        ENV.carW = CAR_A * SCALE;
        ENV.carH = CAR_B * SCALE;
        ENV.Lg = Lg_m * SCALE;
        ENV.Rg = Rg_m * SCALE;
        ENV.Lg_m = Lg_m;
        ENV.Rg_m = Rg_m;

        const MARGIN = 18; // Lề giữa vạch vàng (chip) và viền ngoài (border)

        // Các mốc tọa độ chính để vẽ bản đồ
        ENV.roadLeft = 100;
        ENV.roadRight = ENV.roadLeft + (RoadW_m * SCALE);

        ENV.mapTop = 50;
        ENV.mapBottom = ENV.mapTop + ENV.Lg + 500; // Đủ dài để lấy đà tiến/lùi

        // Tọa độ Vạch Vàng (Chip) của chuồng đỗ ngang (Bên phải đường)
        ENV.chipTop = ENV.mapTop + 200; // Cách top một đoạn
        ENV.chipBottom = ENV.chipTop + ENV.Lg;
        ENV.chipLeft = ENV.roadRight;
        ENV.chipRight = ENV.chipLeft + ENV.Rg;

        // Border tường bao bên ngoài
        ENV.borderTop = ENV.chipTop - MARGIN;
        ENV.borderBottom = ENV.chipBottom + MARGIN;
        ENV.borderRight = ENV.chipRight + MARGIN;

        // Vạch vàng bắt lỗi (Chỉ có 3 cạnh: Trên, Phải, Dưới)
        yellowLines = [
            { x1: ENV.chipLeft, y1: ENV.chipTop, x2: ENV.chipRight, y2: ENV.chipTop }, // Top
            { x1: ENV.chipRight, y1: ENV.chipTop, x2: ENV.chipRight, y2: ENV.chipBottom }, // Right
            { x1: ENV.chipLeft, y1: ENV.chipBottom, x2: ENV.chipRight, y2: ENV.chipBottom }  // Bottom
        ];

        // Các đường viền bao quanh toàn bộ bản đồ (Sẽ cản xe lại)
        borderLines = [
            {x1: ENV.roadLeft, y1: ENV.mapTop, x2: ENV.roadRight, y2: ENV.mapTop}, // Chặn trên
            {x1: ENV.roadRight, y1: ENV.mapTop, x2: ENV.roadRight, y2: ENV.borderTop}, // Lề phải trên
            {x1: ENV.roadRight, y1: ENV.borderTop, x2: ENV.borderRight, y2: ENV.borderTop}, // Tường chuồng trên
            {x1: ENV.borderRight, y1: ENV.borderTop, x2: ENV.borderRight, y2: ENV.borderBottom}, // Tường chuồng phải
            {x1: ENV.borderRight, y1: ENV.borderBottom, x2: ENV.roadRight, y2: ENV.borderBottom}, // Tường chuồng dưới
            {x1: ENV.roadRight, y1: ENV.borderBottom, x2: ENV.roadRight, y2: ENV.mapBottom}, // Lề phải dưới
            {x1: ENV.roadRight, y1: ENV.mapBottom, x2: ENV.roadLeft, y2: ENV.mapBottom}, // Chặn dưới
            {x1: ENV.roadLeft, y1: ENV.mapBottom, x2: ENV.roadLeft, y2: ENV.mapTop} // Lề trái
        ];
    }

    // Reset vị trí xe về vị trí ban đầu (Nằm dưới chuồng một chút, chuẩn bị tiến lên để ghép)
    function resetCarPosition() {
        car.x = ENV.roadRight - (ENV.carH / 2) - 20;
        car.y = ENV.chipBottom + (ENV.carW / 2) + 100;
        car.angle = -Math.PI / 2; // Hướng LÊN TRÊN
        car.steeringTurns = 0;
        car.isMoving = false;
        hasParkingSuccess = false;
        hasExerciseCompleted = false;
        warningMsg.style.display = 'none';
    }

    document.getElementById('btnReset').addEventListener('click', () => {
        resetCarPosition();
        car.gear = 1;
        updateGearUI();
        document.activeElement.blur();
    });

    document.getElementById('cfgCarA').oninput = (e) => {
        CAR_A = parseFloat(e.target.value) || 3.5;
        calculateEnvironment();
        calculateMapOffset();
        resetCarPosition();
    };
    document.getElementById('cfgCarB').oninput = (e) => {
        CAR_B = parseFloat(e.target.value) || 1.8;
        calculateEnvironment();
        calculateMapOffset();
        resetCarPosition();
    };
    document.getElementById('cfgMoveSpeed').oninput = (e) => {
        document.getElementById('valMove').innerText = e.target.value; GAME_CONFIG.moveSpeed = parseFloat(e.target.value);
    };
    document.getElementById('cfgSteerSpeed').oninput = (e) => {
        document.getElementById('valSteer').innerText = e.target.value; GAME_CONFIG.steerSpeed = parseFloat(e.target.value);
    };

    calculateEnvironment();
    resetCarPosition();

    window.addEventListener('mouseover', () => {
        if (document.activeElement.tagName?.toLowerCase() !== 'input') {
            window.focus();
        }
    });

    window.addEventListener('keydown', (e) => {
        if (e.target.tagName?.toLowerCase() === 'input') return;
        const key = e.key.toLowerCase();
        if(key === 'a') keys.A = true;
        if(key === 'd') keys.D = true;
    });
    window.addEventListener('keyup', (e) => {
        const key = e.key.toLowerCase();
        if(key === 'a') keys.A = false;
        if(key === 'd') keys.D = false;
    });

    window.addEventListener('wheel', (e) => {
        if (!e.target.closest('.dashboard')) {
            if (e.deltaY < 0) car.gear = 1;
            else if (e.deltaY > 0) car.gear = -1;
            updateGearUI();
            e.preventDefault();
        }
    }, { passive: false });

    canvas.addEventListener('mousedown', (e) => {
        if (e.button === 0) car.isMoving = true;
    });
    window.addEventListener('mouseup', (e) => {
        if (e.button === 0) car.isMoving = false;
    });
    canvas.addEventListener('mouseleave', () => { car.isMoving = false; });

    function updateGearUI() {
        gearForward.className = 'gear ' + (car.gear === 1 ? 'active-forward' : '');
        gearReverse.className = 'gear ' + (car.gear === -1 ? 'active-reverse' : '');
    }

    function linesIntersect(a, b, c, d, p, q, r, s) {
        let det, gamma, lambda;
        det = (c - a) * (s - q) - (r - p) * (d - b);
        if (det === 0) return false;
        lambda = ((s - q) * (r - a) + (p - r) * (s - b)) / det;
        gamma = ((b - d) * (r - a) + (c - a) * (s - b)) / det;
        return (0 < lambda && lambda < 1) && (0 < gamma && gamma < 1);
    }

    function getCarCorners(cx = car.x, cy = car.y, cangle = car.angle) {
        const cos = Math.cos(cangle);
        const sin = Math.sin(cangle);
        const front = (ENV.carW / 2) * COLLISION_FRONT_SCALE;
        const rear = (ENV.carW / 2) * COLLISION_REAR_SCALE;
        const halfSide = (ENV.carH / 2) * COLLISION_SIDE_SCALE;
        return [
            { x: cx + front*cos - halfSide*sin, y: cy + front*sin + halfSide*cos },
            { x: cx + front*cos + halfSide*sin, y: cy + front*sin - halfSide*cos },
            { x: cx - rear*cos + halfSide*sin, y: cy - rear*sin - halfSide*cos },
            { x: cx - rear*cos - halfSide*sin, y: cy - rear*sin + halfSide*cos }
        ];
    }

    function carLocalToWorld(localX, localY, cx = car.x, cy = car.y, cangle = car.angle) {
        const cos = Math.cos(cangle);
        const sin = Math.sin(cangle);
        return {
            x: cx + localX * cos - localY * sin,
            y: cy + localX * sin + localY * cos
        };
    }

    function isCarOnMainRoad() {
        return (car.x >= ENV.roadLeft && car.x <= ENV.roadRight);
    }

    function updateParkingMilestones(isHittingBorder, isHittingYellowLine) {
        if (isHittingBorder || isHittingYellowLine) return;

        // Điểm xét đỗ thành công ghép ngang: Toàn bộ góc xe nằm trọn trong vạch vàng + thân thẳng
        const corners = getCarCorners();
        const TOLERANCE = 5; // Pixel du di
        const isInsideSpot = corners.every(c =>
            c.x >= ENV.chipLeft - TOLERANCE &&
            c.x <= ENV.chipRight + TOLERANCE &&
            c.y >= ENV.chipTop - TOLERANCE &&
            c.y <= ENV.chipBottom + TOLERANCE
        );

        // Thân xe tương đối thẳng (góc xoay gần -PI/2 hoặc PI/2)
        const isStraight = Math.abs(Math.cos(car.angle)) < 0.15;

        if (!hasParkingSuccess && isInsideSpot && isStraight) {
            hasParkingSuccess = true;
        }

        // Hoàn thành: Đã đỗ thành công và đánh xe tiến ra đường chính
        if (hasParkingSuccess && !hasExerciseCompleted && isCarOnMainRoad() && car.y < ENV.chipTop - 20) {
            hasExerciseCompleted = true;
        }
    }

    function prepareCarImageCrop() {
        if (!carImage.complete || carImage.naturalWidth <= 0 || carImage.naturalHeight <= 0) return;
        if (carImageCrop.ready) return;

        const w = carImage.naturalWidth;
        const h = carImage.naturalHeight;
        const off = document.createElement('canvas');
        off.width = w;
        off.height = h;
        const offCtx = off.getContext('2d');
        offCtx.drawImage(carImage, 0, 0);
        const data = offCtx.getImageData(0, 0, w, h).data;

        let minX = w, minY = h, maxX = -1, maxY = -1;
        for (let y = 0; y < h; y++) {
            for (let x = 0; x < w; x++) {
                const alpha = data[(y * w + x) * 4 + 3];
                if (alpha > 12) {
                    if (x < minX) minX = x;
                    if (y < minY) minY = y;
                    if (x > maxX) maxX = x;
                    if (y > maxY) maxY = y;
                }
            }
        }

        if (maxX >= minX && maxY >= minY) {
            carImageCrop.sx = minX;
            carImageCrop.sy = minY;
            carImageCrop.sw = maxX - minX + 1;
            carImageCrop.sh = maxY - minY + 1;
        } else {
            carImageCrop.sx = 0;
            carImageCrop.sy = 0;
            carImageCrop.sw = w;
            carImageCrop.sh = h;
        }
        carImageCrop.ready = true;
    }

    function drawClippedGuideLine(px, py, dx, dy, minX, minY, maxX, maxY) {
        const EPS = 1e-6;
        const hits = [];

        if (Math.abs(dx) > EPS) {
            const tLeft = (minX - px) / dx;
            const yLeft = py + tLeft * dy;
            if (yLeft >= minY - EPS && yLeft <= maxY + EPS) hits.push({ x: minX, y: yLeft, t: tLeft });

            const tRight = (maxX - px) / dx;
            const yRight = py + tRight * dy;
            if (yRight >= minY - EPS && yRight <= maxY + EPS) hits.push({ x: maxX, y: yRight, t: tRight });
        }

        if (Math.abs(dy) > EPS) {
            const tTop = (minY - py) / dy;
            const xTop = px + tTop * dx;
            if (xTop >= minX - EPS && xTop <= maxX + EPS) hits.push({ x: xTop, y: minY, t: tTop });

            const tBottom = (maxY - py) / dy;
            const xBottom = px + tBottom * dx;
            if (xBottom >= minX - EPS && xBottom <= maxX + EPS) hits.push({ x: xBottom, y: maxY, t: tBottom });
        }

        if (hits.length < 2) return;
        hits.sort((a, b) => a.t - b.t);
        const p1 = hits[0];
        const p2 = hits[hits.length - 1];

        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.stroke();
    }

    function updateSteeringUIState(timeMs) {
        const isNeutral = Math.abs(car.steeringTurns) <= STEER_NEUTRAL_THRESHOLD;

        if (isNeutral && !wasInNeutralZone) {
            steerHoldUntilMs = timeMs + (STRAIGHT_STEER_HOLD_SEC * 1000);
            steerUIState = 'straight';
        } else if (isNeutral) {
            steerUIState = 'straight';
        } else {
            if (timeMs >= steerHoldUntilMs) {
                steerUIState = car.steeringTurns < 0 ? 'left' : 'right';
            } else {
                steerUIState = 'straight';
            }
        }
        wasInNeutralZone = isNeutral;
    }

    let lastTime = 0;
    function update(time) {
        const dt = (time - lastTime) / 1000 || 0;
        lastTime = time;

        let steerDelta = GAME_CONFIG.steerSpeed * dt;
        if (keys.A) car.steeringTurns -= steerDelta;
        if (keys.D) car.steeringTurns += steerDelta;
        car.steeringTurns = Math.max(-GAME_CONFIG.maxSteerTurns, Math.min(GAME_CONFIG.maxSteerTurns, car.steeringTurns));

        wheelImg.style.transform = `rotate(${car.steeringTurns * 360}deg)`;
        updateSteeringUIState(time);
        let turnsAbs = Math.abs(car.steeringTurns).toFixed(1);
        if (steerUIState === 'left') {
            steeringText.innerText = `Lái trái: ${turnsAbs}`;
            steeringText.className = 'w-32 text-lg font-bold text-red-400 text-center';
        } else if (steerUIState === 'right') {
            steeringText.innerText = `Lái phải: ${turnsAbs}`;
            steeringText.className = 'w-32 text-lg font-bold text-blue-400 text-center';
        } else {
            steeringText.innerText = `Thẳng lái`;
            steeringText.className = 'w-32 text-lg font-bold text-yellow-600 text-center';
        }

        let isHittingBorder = false;
        let isHittingYellowLine = false;

        if (car.isMoving && car.gear !== 0) {
            let wheelAngleRad = (car.steeringTurns / GAME_CONFIG.maxSteerTurns) * GAME_CONFIG.maxSteerAngleRad;
            let wheelbase = ENV.carW * 0.6;
            let velocity = GAME_CONFIG.moveSpeed * 60 * dt * car.gear;

            let nextX = car.x + Math.cos(car.angle) * velocity;
            let nextY = car.y + Math.sin(car.angle) * velocity;
            let nextAngle = car.angle + (velocity / wheelbase) * Math.tan(wheelAngleRad);

            const nextCorners = getCarCorners(nextX, nextY, nextAngle);
            const nextEdges = [
                [nextCorners[0], nextCorners[1]], [nextCorners[1], nextCorners[2]],
                [nextCorners[2], nextCorners[3]], [nextCorners[3], nextCorners[0]]
            ];

            for (let edge of nextEdges) {
                for (let line of borderLines) {
                    if (linesIntersect(edge[0].x, edge[0].y, edge[1].x, edge[1].y, line.x1, line.y1, line.x2, line.y2)) {
                        isHittingBorder = true; break;
                    }
                }
                if (isHittingBorder) break;
            }

            if (!isHittingBorder) {
                car.x = nextX;
                car.y = nextY;
                car.angle = nextAngle;
            }
        }

        const currentCorners = getCarCorners();
        const currentEdges = [
            [currentCorners[0], currentCorners[1]], [currentCorners[1], currentCorners[2]],
            [currentCorners[2], currentCorners[3]], [currentCorners[3], currentCorners[0]]
        ];

        for (let edge of currentEdges) {
            for (let line of yellowLines) {
                if (linesIntersect(edge[0].x, edge[0].y, edge[1].x, edge[1].y, line.x1, line.y1, line.x2, line.y2)) {
                    isHittingYellowLine = true; break;
                }
            }
            if (isHittingYellowLine) break;
        }

        if (!isHittingBorder) {
            for (let edge of currentEdges) {
                for (let line of borderLines) {
                    if (linesIntersect(edge[0].x, edge[0].y, edge[1].x, edge[1].y, line.x1, line.y1, line.x2, line.y2)) {
                        isHittingBorder = true; break;
                    }
                }
                if (isHittingBorder) break;
            }
        }

        updateParkingMilestones(isHittingBorder, isHittingYellowLine);

        if (isHittingBorder) {
            warningMsg.innerText = "⚠️ XE CHẠM LỀ ⚠️";
            warningMsg.style.backgroundColor = "#991b1b";
            warningMsg.style.display = 'block';
        } else if (isHittingYellowLine) {
            warningMsg.innerText = "⚠️ XE ĐÈ VẠCH ⚠️";
            warningMsg.style.backgroundColor = "#ef4444";
            warningMsg.style.display = 'block';
        } else if (hasExerciseCompleted) {
            warningMsg.innerText = "🎉 HOÀN THÀNH BÀI GHÉP XE 🎉";
            warningMsg.style.backgroundColor = "#065f46";
            warningMsg.style.display = 'block';
        } else if (hasParkingSuccess) {
            warningMsg.innerText = "✅ GHÉP XE THÀNH CÔNG ✅";
            warningMsg.style.backgroundColor = "#15803d";
            warningMsg.style.display = 'block';
        } else {
            warningMsg.style.display = 'none';
        }
    }

    function draw() {
        ctx.fillStyle = '#16a34a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.save();
        ctx.translate(mapOffsetX, mapOffsetY);

        // -- VẼ PATH BAO QUANH BẢN ĐỒ (BÀI GHÉP NGANG) --
        ctx.beginPath();
        ctx.moveTo(ENV.roadLeft, ENV.mapTop);
        ctx.lineTo(ENV.roadRight, ENV.mapTop);
        ctx.lineTo(ENV.roadRight, ENV.borderTop);
        ctx.lineTo(ENV.borderRight, ENV.borderTop);
        ctx.lineTo(ENV.borderRight, ENV.borderBottom);
        ctx.lineTo(ENV.roadRight, ENV.borderBottom);
        ctx.lineTo(ENV.roadRight, ENV.mapBottom);
        ctx.lineTo(ENV.roadLeft, ENV.mapBottom);
        ctx.closePath();

        ctx.fillStyle = '#94a3b8'; // Nền đường
        ctx.fill();

        // Stroke Border Trắng Đỏ liên tục
        ctx.lineWidth = 6;
        ctx.strokeStyle = 'white';
        ctx.setLineDash([]);
        ctx.stroke();

        ctx.strokeStyle = '#ef4444';
        ctx.setLineDash([20, 20]);
        ctx.stroke();
        ctx.setLineDash([]);

        // -- VẼ VẠCH CHIP VÀNG (3 mặt trong chuồng ngang) --
        ctx.beginPath();
        ctx.moveTo(yellowLines[0].x1, yellowLines[0].y1); ctx.lineTo(yellowLines[0].x2, yellowLines[0].y2); // Cạnh trên
        ctx.moveTo(yellowLines[1].x1, yellowLines[1].y1); ctx.lineTo(yellowLines[1].x2, yellowLines[1].y2); // Cạnh phải (đáy chuồng ngang)
        ctx.moveTo(yellowLines[2].x1, yellowLines[2].y1); ctx.lineTo(yellowLines[2].x2, yellowLines[2].y2); // Cạnh dưới
        ctx.strokeStyle = '#eab308';
        ctx.lineWidth = 3;
        ctx.stroke();

        // -- VẼ VẠCH ĐỨT CỬA CHUỒNG --
        ctx.beginPath();
        ctx.moveTo(ENV.chipLeft, ENV.chipTop);
        ctx.lineTo(ENV.chipLeft, ENV.chipBottom);
        ctx.strokeStyle = '#f8fafc';
        ctx.lineWidth = 2;
        ctx.setLineDash([10, 10]);
        ctx.stroke();
        ctx.setLineDash([]);

        // -- VẼ CHỮ GHI CHÚ KÍCH THƯỚC --
        ctx.fillStyle = '#f8fafc';
        ctx.font = 'bold 14px sans-serif';

        // Ghi chú Lg (Dọc)
        ctx.save();
        ctx.translate(ENV.borderRight + 15, ENV.chipTop + ENV.Lg/2);
        ctx.rotate(Math.PI/2);
        ctx.textAlign = 'center';
        ctx.fillStyle = '#fde047';
        ctx.fillText(`Lg = ${ENV.Lg_m.toFixed(2)}m`, 0, 0);
        ctx.restore();

        // Ghi chú Rg (Ngang)
        ctx.textAlign = 'center';
        ctx.fillStyle = '#fde047';
        ctx.fillText(`Rg = ${ENV.Rg_m.toFixed(2)}m`, ENV.chipLeft + ENV.Rg/2, ENV.borderBottom + 25);

        // -- VẼ Ô TÔ --
        ctx.save();
        ctx.translate(car.x, car.y);
        ctx.rotate(car.angle);

        if (carImage.complete && carImage.naturalWidth > 0) {
            prepareCarImageCrop();
            if (carImageCrop.ready) {
                ctx.drawImage(
                    carImage,
                    carImageCrop.sx, carImageCrop.sy, carImageCrop.sw, carImageCrop.sh,
                    -ENV.carW/2, -ENV.carH/2, ENV.carW, ENV.carH
                );
            } else {
                ctx.drawImage(carImage, -ENV.carW/2, -ENV.carH/2, ENV.carW, ENV.carH);
            }
        } else {
            ctx.fillStyle = 'red';
            ctx.fillRect(-ENV.carW/2, -ENV.carH/2, ENV.carW, ENV.carH);
            ctx.fillStyle = 'yellow'; // Đầu xe
            ctx.fillRect(ENV.carW/2 - 10, -ENV.carH/2, 10, ENV.carH);
        }

        ctx.restore();

        // -- VẼ 2 ĐƯỜNG CĂN MỜ --
        const mapMinX = ENV.roadLeft;
        const mapMaxX = ENV.borderRight;
        const mapMinY = ENV.mapTop;
        const mapMaxY = ENV.mapBottom;

        const steeringPos = carLocalToWorld(
            ENV.carW * STEERING_LOCAL_RATIO.x,
            ENV.carH * STEERING_LOCAL_RATIO.y
        );
        const driverSeatPos = carLocalToWorld(
            ENV.carW * DRIVER_SEAT_LOCAL_RATIO.x,
            ENV.carH * DRIVER_SEAT_LOCAL_RATIO.y
        );

        ctx.save();
        ctx.strokeStyle = 'rgba(253, 230, 138, 0.72)';
        ctx.lineWidth = 1;
        ctx.setLineDash([7, 7]);

        const dirLongX = Math.cos(car.angle);
        const dirLongY = Math.sin(car.angle);
        const dirSideX = -Math.sin(car.angle);
        const dirSideY = Math.cos(car.angle);

        drawClippedGuideLine(
            steeringPos.x, steeringPos.y,
            dirLongX, dirLongY,
            mapMinX, mapMinY, mapMaxX, mapMaxY
        );

        drawClippedGuideLine(
            driverSeatPos.x, driverSeatPos.y,
            dirSideX, dirSideY,
            mapMinX, mapMinY, mapMaxX, mapMaxY
        );

        ctx.setLineDash([]);
        ctx.restore();

        if (SHOW_HITBOX_DEBUG) {
            const corners = getCarCorners(car.x, car.y, car.angle);
            ctx.strokeStyle = '#22d3ee';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(corners[0].x, corners[0].y);
            ctx.lineTo(corners[1].x, corners[1].y);
            ctx.lineTo(corners[2].x, corners[2].y);
            ctx.lineTo(corners[3].x, corners[3].y);
            ctx.closePath();
            ctx.stroke();
        }

        ctx.restore();
    }

    function gameLoop(time) {
        update(time);
        draw();
        requestAnimationFrame(gameLoop);
    }

    function resizeCanvas() {
        const canvasContainer = canvas.parentElement;
        const rect = canvasContainer.getBoundingClientRect();
        canvas.width = Math.floor(rect.width);
        canvas.height = Math.floor(rect.height);
        calculateMapOffset();
    }
    window.addEventListener('resize', resizeCanvas);
    if (carImage.complete) {
        prepareCarImageCrop();
    } else {
        carImage.addEventListener('load', prepareCarImageCrop);
    }
    window.onload = () => {
        resizeCanvas();
        updateGearUI();
        requestAnimationFrame(gameLoop);
    };

</script>
</body>
