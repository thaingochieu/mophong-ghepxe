<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mô Phỏng Ghép Xe Dọc</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1a202c; color: white; font-family: sans-serif; }
        
        /* Bảng điều khiển nằm ngang trên cùng */
        .dashboard { 
            background: #2d3748; 
            border-bottom: 2px solid #4a5568; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            z-index: 20;
        }
        
        canvas { 
            display: block; 
            border-radius: 8px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); 
            cursor: crosshair;
        }

        .wheel-container { position: relative; width: 80px; height: 80px; }
        .wheel { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; transition: transform 0.1s linear; }
        
        .gear { padding: 4px 10px; font-size: 11px; border-radius: 4px; background: #4a5568; color: #a0aec0; border: 2px solid transparent; transition: all 0.2s; font-weight: bold;}
        .gear.active-forward { background: #fee2e2; color: #ef4444; border-color: #ef4444; box-shadow: 0 0 10px rgba(239, 68, 68, 0.4);}
        .gear.active-reverse { background: #e0f2fe; color: #3b82f6; border-color: #3b82f6; box-shadow: 0 0 10px rgba(59, 130, 246, 0.4);}
        
        .warning-overlay { 
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            padding: 10px 30px; border-radius: 8px; font-size: 1.5rem; font-weight: bold;
            display: none; z-index: 30; animation: blink 0.5s infinite alternate;
        }

        @keyframes blink { from { opacity: 1; } to { opacity: 0.5; } }
        
        input[type="range"] { cursor: pointer; }
        .kbd { background: #1a202c; padding: 2px 4px; border-radius: 4px; font-family: monospace; font-size: 0.85em; border-bottom: 1px solid #000; color: #63b3ed;}
    </style>
</head>
<body class="flex flex-col h-screen w-screen">

    <!-- Bảng điều khiển (Ngang, trên cùng) -->
    <div class="dashboard w-full px-6 py-3 flex justify-between items-center gap-4">
        
        <!-- Cụm 1: Vô lăng, Cần số & Thông số -->
        <div class="flex items-center gap-4 bg-gray-800 p-2 rounded-lg border border-gray-600">
            <div class="flex flex-col items-center gap-1.5">
                <div class="wheel-container">
                    <img id="wheelImg" src="steering_wheel.png" class="wheel" alt="Vô lăng">
                </div>
                <!-- Cần số thu nhỏ -->
                <div class="flex items-center gap-2">
                    <div id="gearForward" class="gear active-forward">TIẾN</div>
                    <div id="gearReverse" class="gear">LÙI</div>
                    <button id="btnReset" class="gear bg-red-600 hover:bg-red-500 text-white border-red-500 cursor-pointer ml-1" title="Đặt lại vị trí xe">RESET</button>
                </div>
            </div>
            <div id="steeringText" class="w-24 text-base font-bold text-yellow-400 text-center">Thẳng lái</div>
        </div>

        <!-- Cụm 2: Cấu hình Kích thước & Tốc độ -->
        <div class="flex gap-6 bg-gray-800 p-3 rounded-lg border border-gray-600">
            <!-- Cột Tốc độ -->
            <div class="flex flex-col gap-2">
                <div class="flex flex-col">
                    <label class="text-xs text-gray-300 flex justify-between">Tốc độ: <span id="valMove">1.5</span></label>
                    <input type="range" id="cfgMoveSpeed" class="w-28" min="0.5" max="3" step="0.1" value="1.5">
                </div>
                <div class="flex flex-col">
                    <label class="text-xs text-gray-300 flex justify-between">Quay lái: <span id="valSteer">2.0</span></label>
                    <input type="range" id="cfgSteerSpeed" class="w-28" min="0.5" max="4" step="0.1" value="2.0">
                </div>
            </div>
            <!-- Cột Kích thước -->
            <div class="flex flex-col gap-2 justify-center">
                <div class="flex justify-between items-center gap-2">
                    <label class="text-xs text-green-300">Dài xe (a):</label>
                    <div class="flex items-center">
                        <input type="number" id="cfgCarA" class="w-16 h-6 bg-gray-700 text-white rounded px-1.5 text-sm border border-gray-600 focus:outline-none focus:border-green-400" min="3.5" max="6.0" step="0.1" value="4.5">
                        <span class="ml-1 text-xs text-gray-400">m</span>
                    </div>
                </div>
                <div class="flex justify-between items-center gap-2">
                    <label class="text-xs text-green-300">Rộng xe (b):</label>
                    <div class="flex items-center">
                        <input type="number" id="cfgCarB" class="w-16 h-6 bg-gray-700 text-white rounded px-1.5 text-sm border border-gray-600 focus:outline-none focus:border-green-400" min="1.4" max="2.4" step="0.1" value="1.8">
                        <span class="ml-1 text-xs text-gray-400">m</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Cụm 4: Hướng dẫn -->
        <div class="bg-gray-800 p-3 rounded-lg border border-gray-600 text-[13px] text-gray-300 leading-relaxed">
            <span class="kbd">A</span> / <span class="kbd">D</span> : Quay vô lăng trái/phải <br>
            <span class="kbd">Cuộn ↑↓</span> : Sang số Tiến/Lùi <br>
            <span class="kbd">Giữ Chuột Trái</span> : Đạp ga (Di chuyển)
        </div>
    </div>

    <!-- Khu vực Canvas Game -->
    <div class="flex-1 flex items-center justify-center relative bg-gray-900 overflow-hidden">
        <div id="warningMsg" class="warning-overlay" style="background-color: #ef4444; color: white;">
            ⚠️ XE ĐÈ VẠCH ⚠️
        </div>
        <canvas id="gameCanvas" width="1000" height="700"></canvas>
    </div>

    <!-- Load xe -->
    <img id="carImg" src="car.png" style="display: none;">

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // UI Elements
    const wheelImg = document.getElementById('wheelImg');
    const steeringText = document.getElementById('steeringText');
    const gearForward = document.getElementById('gearForward');
    const gearReverse = document.getElementById('gearReverse');
    const warningMsg = document.getElementById('warningMsg');
    const carImage = document.getElementById('carImg');

    // TỶ LỆ CHUYỂN ĐỔI: 1 mét = 45 pixels
    const SCALE = 45; 

    // Các biến Kích thước & Môi trường
    let CAR_A = 4.5;
    let CAR_B = 1.8;
    let ENV = {};
    let yellowLines = [];
    let borderLines = []; // Thêm mảng chứa các đường bao quanh map để chặn xe

    const GAME_CONFIG = {
        moveSpeed: 1.5, 
        steerSpeed: 2.0, 
        maxSteerTurns: 2.5,
        maxSteerAngleRad: 40 * (Math.PI / 180), 
    };

    const car = {
        x: 0, y: 0,
        angle: Math.PI / 2, // Mặt định quay xuống dưới (90 độ)
        steeringTurns: 0, 
        gear: 1, 
        isMoving: false
    };

    const keys = { A: false, D: false };

    // Hàm tính toán Hình học toàn bộ bản đồ
    function calculateEnvironment() {
        const Ld_m = CAR_A + 1.0;
        const Rd_m = CAR_B + 0.6;
        const Ed_m = 1.2 * CAR_A;

        ENV.carW = CAR_A * SCALE; 
        ENV.carH = CAR_B * SCALE; 
        ENV.Ld = Ld_m * SCALE;    
        ENV.Rd = Rd_m * SCALE;    
        ENV.Ed = Ed_m * SCALE;    
        ENV.Ld_m = Ld_m;
        ENV.Rd_m = Rd_m;
        ENV.Ed_m = Ed_m;

        const MARGIN = 18; // Lề giữa vạch vàng (chip) và viền ngoài (border)

        // Các mốc tọa độ chính để vẽ bản đồ
        ENV.mapLeft = 40; 
        ENV.roadTop = 260; // Đường ngang bắt đầu hơi thấp để nhường chỗ cho đường dọc bên phải
        ENV.roadBottom = ENV.roadTop + ENV.Ed;

        // Vị trí chuồng đỗ (Border ngoài) - Cạnh trái
        ENV.spotBorderLeft = ENV.mapLeft + ENV.Ed + 20; // Cách đường cụt bên trái 1 đoạn

        // Tọa độ Vạch Vàng (Chip) - Lùi xuống 1 khoảng MARGIN so với miệng chuồng
        ENV.chipTop = ENV.roadBottom + MARGIN;
        ENV.chipBottom = ENV.chipTop + ENV.Ld;
        ENV.chipLeft = ENV.spotBorderLeft + MARGIN;
        ENV.chipRight = ENV.chipLeft + ENV.Rd;

        // Cập nhật lại Border phải và đáy dựa trên vạch chip để bao ngoài đều nhau
        ENV.spotBorderRight = ENV.chipRight + MARGIN;
        ENV.spotBorderBottom = ENV.chipBottom + MARGIN;

        // Vị trí đường dọc bên phải (nối dài lên trên)
        ENV.rightRoadLeft = ENV.spotBorderRight + ENV.Ed; 
        ENV.rightRoadRight = ENV.rightRoadLeft + ENV.Ed;
        ENV.rightRoadTop = 40; 
        ENV.rightRoadBottom = ENV.roadBottom + 120; // Đường dọc kéo dài qua ngã 3 một chút

        // Định nghĩa 3 đoạn vạch vàng để bắt lỗi va chạm (Chỉ cảnh báo)
        yellowLines = [
            { x1: ENV.chipLeft, y1: ENV.chipTop, x2: ENV.chipLeft, y2: ENV.chipBottom }, // Cạnh trái chuồng
            { x1: ENV.chipRight, y1: ENV.chipTop, x2: ENV.chipRight, y2: ENV.chipBottom }, // Cạnh phải chuồng
            { x1: ENV.chipLeft, y1: ENV.chipBottom, x2: ENV.chipRight, y2: ENV.chipBottom }  // Đáy chuồng
        ];

        // Định nghĩa các đường viền bao quanh toàn bộ bản đồ (Sẽ cản xe lại)
        borderLines = [
            {x1: ENV.mapLeft, y1: ENV.roadTop, x2: ENV.rightRoadLeft, y2: ENV.roadTop},
            {x1: ENV.rightRoadLeft, y1: ENV.roadTop, x2: ENV.rightRoadLeft, y2: ENV.rightRoadTop},
            {x1: ENV.rightRoadLeft, y1: ENV.rightRoadTop, x2: ENV.rightRoadRight, y2: ENV.rightRoadTop},
            {x1: ENV.rightRoadRight, y1: ENV.rightRoadTop, x2: ENV.rightRoadRight, y2: ENV.rightRoadBottom},
            {x1: ENV.rightRoadRight, y1: ENV.rightRoadBottom, x2: ENV.rightRoadLeft, y2: ENV.rightRoadBottom},
            {x1: ENV.rightRoadLeft, y1: ENV.rightRoadBottom, x2: ENV.rightRoadLeft, y2: ENV.roadBottom},
            {x1: ENV.rightRoadLeft, y1: ENV.roadBottom, x2: ENV.spotBorderRight, y2: ENV.roadBottom},
            {x1: ENV.spotBorderRight, y1: ENV.roadBottom, x2: ENV.spotBorderRight, y2: ENV.spotBorderBottom},
            {x1: ENV.spotBorderRight, y1: ENV.spotBorderBottom, x2: ENV.spotBorderLeft, y2: ENV.spotBorderBottom},
            {x1: ENV.spotBorderLeft, y1: ENV.spotBorderBottom, x2: ENV.spotBorderLeft, y2: ENV.roadBottom},
            {x1: ENV.spotBorderLeft, y1: ENV.roadBottom, x2: ENV.mapLeft, y2: ENV.roadBottom},
            {x1: ENV.mapLeft, y1: ENV.roadBottom, x2: ENV.mapLeft, y2: ENV.roadTop} // Đóng khung bên trái
        ];
    }

    // Reset vị trí xe về vị trí ban đầu (Trên đường dọc bên phải, hướng xuống)
    function resetCarPosition() {
        car.x = ENV.rightRoadLeft + (ENV.Ed / 2);
        car.y = ENV.rightRoadTop + (ENV.carW / 2) + 20;
        car.angle = Math.PI / 2; // Hướng xuống (90 độ)
        car.steeringTurns = 0;
        car.isMoving = false;
        warningMsg.style.display = 'none'; // Ẩn thông báo đè vạch nếu có
    }

    // Gắn sự kiện cho nút Reset
    document.getElementById('btnReset').addEventListener('click', () => {
        resetCarPosition();
        car.gear = 1;
        updateGearUI();
        document.activeElement.blur(); // Bỏ focus khỏi nút sau khi click để tránh kẹt phím
    });

    // Lắng nghe thay đổi Cấu hình
    document.getElementById('cfgCarA').oninput = (e) => { 
        CAR_A = parseFloat(e.target.value) || 4.5; 
        calculateEnvironment(); resetCarPosition();
    };
    document.getElementById('cfgCarB').oninput = (e) => { 
        CAR_B = parseFloat(e.target.value) || 1.8; 
        calculateEnvironment(); resetCarPosition();
    };
    document.getElementById('cfgMoveSpeed').oninput = (e) => { 
        document.getElementById('valMove').innerText = e.target.value; GAME_CONFIG.moveSpeed = parseFloat(e.target.value); 
    };
    document.getElementById('cfgSteerSpeed').oninput = (e) => { 
        document.getElementById('valSteer').innerText = e.target.value; GAME_CONFIG.steerSpeed = parseFloat(e.target.value); 
    };

    // Khởi tạo ban đầu
    calculateEnvironment();
    resetCarPosition();

    // Tự động focus vào cửa sổ game khi di chuyển chuột vào để nhận phím ngay (không cần click)
    window.addEventListener('mouseover', () => {
        if (document.activeElement.tagName?.toLowerCase() !== 'input') {
            window.focus();
        }
    });

    // Điều khiển Bàn phím (Bỏ qua focus nếu đang nhập input)
    window.addEventListener('keydown', (e) => {
        if (e.target.tagName?.toLowerCase() === 'input') return;
        const key = e.key.toLowerCase();
        if(key === 'a') keys.A = true;
        if(key === 'd') keys.D = true;
    });
    window.addEventListener('keyup', (e) => {
        const key = e.key.toLowerCase();
        if(key === 'a') keys.A = false;
        if(key === 'd') keys.D = false;
    });

    // Cuộn chuột gài số
    window.addEventListener('wheel', (e) => {
        if (!e.target.closest('.dashboard')) {
            if (e.deltaY < 0) car.gear = 1;      // Cuộn lên -> Tiến
            else if (e.deltaY > 0) car.gear = -1; // Cuộn xuống -> Lùi
            updateGearUI();
            e.preventDefault();
        }
    }, { passive: false });

    // Giữ chuột trái di chuyển
    canvas.addEventListener('mousedown', (e) => {
        if (e.button === 0) car.isMoving = true;
    });
    window.addEventListener('mouseup', (e) => {
        if (e.button === 0) car.isMoving = false;
    });
    canvas.addEventListener('mouseleave', () => { car.isMoving = false; });

    function updateGearUI() {
        gearForward.className = 'gear ' + (car.gear === 1 ? 'active-forward' : '');
        gearReverse.className = 'gear ' + (car.gear === -1 ? 'active-reverse' : '');
    }

    // Math: Kiểm tra 2 đoạn thẳng giao nhau
    function linesIntersect(a, b, c, d, p, q, r, s) {
        let det, gamma, lambda;
        det = (c - a) * (s - q) - (r - p) * (d - b);
        if (det === 0) return false;
        lambda = ((s - q) * (r - a) + (p - r) * (s - b)) / det;
        gamma = ((b - d) * (r - a) + (c - a) * (s - b)) / det;
        return (0 < lambda && lambda < 1) && (0 < gamma && gamma < 1);
    }

    // Lấy tọa độ 4 góc của ô tô (Có thể truyền tọa độ ảo để dự đoán va chạm)
    function getCarCorners(cx = car.x, cy = car.y, cangle = car.angle) {
        const cos = Math.cos(cangle);
        const sin = Math.sin(cangle);
        const hw = ENV.carW / 2;
        const hh = ENV.carH / 2;
        return [
            { x: cx + hw*cos - hh*sin, y: cy + hw*sin + hh*cos }, // Trái Dưới (Mũi)
            { x: cx + hw*cos + hh*sin, y: cy + hw*sin - hh*cos }, // Phải Dưới (Mũi)
            { x: cx - hw*cos + hh*sin, y: cy - hw*sin - hh*cos }, // Phải Trên (Đuôi)
            { x: cx - hw*cos - hh*sin, y: cy - hw*sin + hh*cos }  // Trái Trên (Đuôi)
        ];
    }

    let lastTime = 0;
    function update(time) {
        const dt = (time - lastTime) / 1000 || 0; 
        lastTime = time;

        // Vô lăng
        let steerDelta = GAME_CONFIG.steerSpeed * dt;
        if (keys.A) car.steeringTurns -= steerDelta;
        if (keys.D) car.steeringTurns += steerDelta;
        car.steeringTurns = Math.max(-GAME_CONFIG.maxSteerTurns, Math.min(GAME_CONFIG.maxSteerTurns, car.steeringTurns));

        wheelImg.style.transform = `rotate(${car.steeringTurns * 360}deg)`;
        let turnsAbs = Math.abs(car.steeringTurns).toFixed(1);
        if (car.steeringTurns < -0.05) {
            steeringText.innerText = `Lái trái: ${turnsAbs}`;
            steeringText.className = 'w-24 text-base font-bold text-red-400 text-center'; 
        } else if (car.steeringTurns > 0.05) {
            steeringText.innerText = `Lái phải: ${turnsAbs}`;
            steeringText.className = 'w-24 text-base font-bold text-blue-400 text-center'; 
        } else {
            steeringText.innerText = `Thẳng lái`;
            steeringText.className = 'w-24 text-base font-bold text-yellow-400 text-center'; 
        }

        let isHittingBorder = false;
        let isHittingYellowLine = false;

        // Vật lý di chuyển
        if (car.isMoving && car.gear !== 0) {
            let wheelAngleRad = (car.steeringTurns / GAME_CONFIG.maxSteerTurns) * GAME_CONFIG.maxSteerAngleRad;
            let wheelbase = ENV.carW * 0.6; 
            let velocity = GAME_CONFIG.moveSpeed * 60 * dt * car.gear;

            // Tính toán tọa độ và góc xoay ở frame tiếp theo (chưa gán ngay)
            let nextX = car.x + Math.cos(car.angle) * velocity;
            let nextY = car.y + Math.sin(car.angle) * velocity;
            let nextAngle = car.angle + (velocity / wheelbase) * Math.tan(wheelAngleRad);

            // Sinh 4 góc xe ảo ở frame tiếp theo
            const nextCorners = getCarCorners(nextX, nextY, nextAngle);
            const nextEdges = [
                [nextCorners[0], nextCorners[1]], [nextCorners[1], nextCorners[2]],
                [nextCorners[2], nextCorners[3]], [nextCorners[3], nextCorners[0]]
            ];

            // Rà soát va chạm vật lý với tường/lề ở vị trí ảo đó
            for (let edge of nextEdges) {
                for (let line of borderLines) {
                    if (linesIntersect(edge[0].x, edge[0].y, edge[1].x, edge[1].y, line.x1, line.y1, line.x2, line.y2)) {
                        isHittingBorder = true; break;
                    }
                }
                if (isHittingBorder) break;
            }

            // Nếu không bị cản bởi tường, mới chính thức cho phép xe di chuyển tới đó
            if (!isHittingBorder) {
                car.x = nextX;
                car.y = nextY;
                car.angle = nextAngle;
            }
        }

        // --- Cập nhật cảnh báo dựa trên tọa độ CHÍNH THỨC của xe hiện tại ---
        const currentCorners = getCarCorners();
        const currentEdges = [
            [currentCorners[0], currentCorners[1]], [currentCorners[1], currentCorners[2]],
            [currentCorners[2], currentCorners[3]], [currentCorners[3], currentCorners[0]]
        ];

        // 1. Kiểm tra vạch chip vàng (Bị trừ điểm)
        for (let edge of currentEdges) {
            for (let line of yellowLines) {
                if (linesIntersect(edge[0].x, edge[0].y, edge[1].x, edge[1].y, line.x1, line.y1, line.x2, line.y2)) {
                    isHittingYellowLine = true; break;
                }
            }
            if (isHittingYellowLine) break;
        }

        // 2. Kiểm tra lại lề ở trạng thái hiện tại (Đề phòng trường hợp thay đổi kích thước xe làm xe đột ngột đè lên lề)
        if (!isHittingBorder) { 
            for (let edge of currentEdges) {
                for (let line of borderLines) {
                    if (linesIntersect(edge[0].x, edge[0].y, edge[1].x, edge[1].y, line.x1, line.y1, line.x2, line.y2)) {
                        isHittingBorder = true; break;
                    }
                }
                if (isHittingBorder) break;
            }
        }

        // 3. Hiển thị thông báo trên màn hình
        if (isHittingBorder) {
            warningMsg.innerText = "⚠️ XE CHẠM LỀ ⚠️";
            warningMsg.style.backgroundColor = "#991b1b"; // Đỏ sậm
            warningMsg.style.display = 'block';
        } else if (isHittingYellowLine) {
            warningMsg.innerText = "⚠️ XE ĐÈ VẠCH ⚠️";
            warningMsg.style.backgroundColor = "#ef4444"; // Đỏ tươi
            warningMsg.style.display = 'block';
        } else {
            warningMsg.style.display = 'none';
        }
    }

    function draw() {
        // Nền cỏ
        ctx.fillStyle = '#16a34a'; 
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // -- VẼ PATH BAO QUANH BẢN ĐỒ --
        ctx.beginPath();
        ctx.moveTo(ENV.mapLeft, ENV.roadTop); // Bắt đầu từ góc trái trên đường ngang
        ctx.lineTo(ENV.rightRoadLeft, ENV.roadTop); // Kéo sang phải đến lề đường dọc
        ctx.lineTo(ENV.rightRoadLeft, ENV.rightRoadTop); // Kéo lên trên
        ctx.lineTo(ENV.rightRoadRight, ENV.rightRoadTop); // Sang ngang đỉnh đường dọc
        ctx.lineTo(ENV.rightRoadRight, ENV.rightRoadBottom); // Kéo thẳng xuống đáy phải
        ctx.lineTo(ENV.rightRoadLeft, ENV.rightRoadBottom); // Sang ngang đáy ngã 3
        ctx.lineTo(ENV.rightRoadLeft, ENV.roadBottom); // Đi ngược lên chạm đáy đường ngang
        ctx.lineTo(ENV.spotBorderRight, ENV.roadBottom); // Đi sang trái đến lề chuồng đỗ
        ctx.lineTo(ENV.spotBorderRight, ENV.spotBorderBottom); // Kéo xuống đáy chuồng
        ctx.lineTo(ENV.spotBorderLeft, ENV.spotBorderBottom); // Sang ngang đáy chuồng
        ctx.lineTo(ENV.spotBorderLeft, ENV.roadBottom); // Kéo lên miệng chuồng
        ctx.lineTo(ENV.mapLeft, ENV.roadBottom); // Kéo về góc trái dưới đường ngang
        ctx.closePath();

        // Fill màu đường nhựa
        ctx.fillStyle = '#94a3b8';
        ctx.fill();

        // Stroke Border Trắng Đỏ liên tục
        ctx.lineWidth = 6;
        ctx.strokeStyle = 'white'; // Lớp nền trắng
        ctx.setLineDash([]);
        ctx.stroke();

        ctx.strokeStyle = '#ef4444'; // Lớp vạch đỏ đứt khúc
        ctx.setLineDash([20, 20]);
        ctx.stroke();
        ctx.setLineDash([]); // Reset

        // -- VẼ VẠCH CHIP VÀNG (Gọn gàng bên trong chuồng) --
        ctx.beginPath();
        ctx.moveTo(yellowLines[0].x1, yellowLines[0].y1); ctx.lineTo(yellowLines[0].x2, yellowLines[0].y2); // Trái
        ctx.moveTo(yellowLines[1].x1, yellowLines[1].y1); ctx.lineTo(yellowLines[1].x2, yellowLines[1].y2); // Phải
        ctx.moveTo(yellowLines[2].x1, yellowLines[2].y1); ctx.lineTo(yellowLines[2].x2, yellowLines[2].y2); // Đáy
        ctx.strokeStyle = '#eab308';
        ctx.lineWidth = 3;
        ctx.stroke();

        // -- VẼ CHỮ GHI CHÚ KÍCH THƯỚC --
        ctx.fillStyle = '#f8fafc';
        ctx.font = 'bold 14px sans-serif';
        ctx.textAlign = 'center';
        
        // Ghi chú Ed ngang
        ctx.fillText(`Ed = ${ENV.Ed_m.toFixed(2)}m`, ENV.mapLeft + (ENV.spotBorderLeft - ENV.mapLeft)/2, ENV.roadBottom + 25);
        // Ghi chú Ed dọc (đường bên phải)
        ctx.save();
        ctx.translate(ENV.rightRoadLeft - 15, ENV.roadTop - 50);
        ctx.rotate(-Math.PI/2);
        ctx.fillText(`Ed = ${ENV.Ed_m.toFixed(2)}m`, 0, 0);
        ctx.restore();

        // Ghi chú Ld (vạch vàng)
        ctx.save();
        ctx.translate(ENV.chipRight + 15, ENV.chipTop + ENV.Ld/2);
        ctx.rotate(Math.PI/2);
        ctx.fillStyle = '#fde047';
        ctx.fillText(`Ld = ${ENV.Ld_m.toFixed(2)}m`, 0, 0);
        ctx.restore();
        
        // Ghi chú Rd (vạch vàng)
        ctx.fillText(`Rd = ${ENV.Rd_m.toFixed(2)}m`, ENV.chipLeft + ENV.Rd/2, ENV.chipBottom - 10);

        // -- VẼ Ô TÔ --
        ctx.save();
        ctx.translate(car.x, car.y);
        ctx.rotate(car.angle);
        
        if (carImage.complete && carImage.naturalWidth > 0) {
            ctx.drawImage(carImage, -ENV.carW/2, -ENV.carH/2, ENV.carW, ENV.carH);
        } else {
            ctx.fillStyle = 'red';
            ctx.fillRect(-ENV.carW/2, -ENV.carH/2, ENV.carW, ENV.carH);
            ctx.fillStyle = 'yellow'; // Đầu xe
            ctx.fillRect(ENV.carW/2 - 10, -ENV.carH/2, 10, ENV.carH);
        }
        ctx.restore();
    }

    function gameLoop(time) {
        update(time);
        draw();
        requestAnimationFrame(gameLoop);
    }

    window.onload = () => {
        updateGearUI();
        requestAnimationFrame(gameLoop);
    };

</script>
</body>
</html>
